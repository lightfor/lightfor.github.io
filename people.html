<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物关系 — Lightfor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
<style>
/* ── Layout ── */
body { margin: 0; padding: 0; overflow: hidden; background: #1a0f07; color: #e8d5b7; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ── Header ── */
.header {
  display: flex; align-items: center; gap: 1rem; padding: 0.6rem 1.2rem;
  background: rgba(26,15,7,0.95); border-bottom: 1px solid #3d2510;
  z-index: 10; flex-shrink: 0;
}
.header a { color: #a07850; font-size: 0.8rem; text-decoration: none; white-space: nowrap; }
.header a:hover { color: #e8d5b7; }
.header h1 { font-size: 1rem; color: #e8d5b7; font-weight: 600; white-space: nowrap; }
.header-sep { color: #3d2510; }

/* Universe tabs */
.universe-tabs { display: flex; gap: 0.4rem; }
.u-tab {
  padding: 0.3rem 0.85rem; border-radius: 14px; font-size: 0.8rem;
  border: 1px solid #4a3020; background: transparent; color: #a07850;
  cursor: pointer; transition: all 0.15s;
}
.u-tab.active { background: #7a4a20; color: #f0d9b5; border-color: #7a4a20; }

/* Controls right side */
.header-right { margin-left: auto; display: flex; align-items: center; gap: 0.6rem; }
.ctrl-btn {
  padding: 0.28rem 0.7rem; border-radius: 12px; font-size: 0.75rem;
  border: 1px solid #4a3020; background: transparent; color: #a07850;
  cursor: pointer; transition: all 0.15s;
}
.ctrl-btn:hover, .ctrl-btn.active { background: #4a3020; color: #f0d9b5; }

/* Search */
.search-wrap { position: relative; }
.search-wrap input {
  background: #2a1810; border: 1px solid #4a3020; color: #e8d5b7;
  border-radius: 14px; padding: 0.28rem 0.8rem 0.28rem 1.8rem;
  font-size: 0.78rem; outline: none; width: 140px; transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: #a07850; }
.search-wrap::before { content: "🔍"; position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%); font-size: 0.7rem; pointer-events: none; }

/* Legend */
.legend { display: flex; gap: 0.8rem; align-items: center; flex-shrink: 0; }
.leg-item { display: flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; color: #7a6040; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; }

/* ── Canvas area ── */
#canvas-wrap {
  flex: 1; position: relative; overflow: hidden;
}
svg#graph {
  width: 100%; height: 100%;
  cursor: grab;
}
svg#graph.panning { cursor: grabbing; }

/* ── SVG styles (injected as stylesheet) ── */
.node-group { cursor: pointer; }
.node-group .node-bg {
  transition: filter 0.2s;
}
.node-group:hover .node-bg, .node-group.hovered .node-bg {
  filter: brightness(1.3) drop-shadow(0 0 10px currentColor);
}
.node-group.faded { opacity: 0.15; }
.node-group.faded .node-label { opacity: 0 }

.edge { stroke-opacity: 0.45; transition: stroke-opacity 0.2s, stroke-width 0.2s; }
.edge.highlighted { stroke-opacity: 1; stroke-width: 2.5; }
.edge.faded { stroke-opacity: 0.05; }

/* ── Tooltip ── */
#tooltip {
  position: fixed; z-index: 200;
  background: rgba(20,10,5,0.97);
  border: 1px solid #7a4a20;
  border-radius: 12px;
  padding: 0.85rem 1rem;
  max-width: 280px; min-width: 200px;
  pointer-events: none;
  opacity: 0; transition: opacity 0.15s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
#tooltip.show { opacity: 1; }
#tooltip .tt-name { font-size: 1.05rem; font-weight: 700; color: #f0d9b5; }
#tooltip .tt-alias { font-size: 0.75rem; color: #a07850; margin-bottom: 0.5rem; }
#tooltip .tt-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
#tooltip .tt-tag { padding: 0.15rem 0.5rem; border-radius: 8px; font-size: 0.7rem; }
#tooltip .tt-desc { font-size: 0.8rem; color: #c8a97a; line-height: 1.6; margin-bottom: 0.6rem; }
#tooltip .tt-rels h4 { font-size: 0.7rem; color: #7a6040; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
#tooltip .tt-rel-item { font-size: 0.78rem; color: #b09060; padding: 0.2rem 0; border-bottom: 1px solid #2a1810; display: flex; justify-content: space-between; }
#tooltip .tt-rel-item:last-child { border-bottom: none; }
#tooltip .tt-rel-name { color: #f0d9b5; }

/* ── Detail panel (click) ── */
#detail {
  position: fixed; right: 0; top: 0; bottom: 0; width: 300px;
  background: rgba(18,10,4,0.97); border-left: 1px solid #3d2510;
  z-index: 150; transform: translateX(100%); transition: transform 0.25s;
  overflow-y: auto; padding: 1.2rem 1.1rem;
}
#detail.open { transform: translateX(0); }
#detail .d-close {
  position: absolute; top: 0.8rem; right: 0.8rem;
  background: none; border: none; color: #7a6040; font-size: 1.1rem;
  cursor: pointer; line-height: 1;
}
#detail .d-close:hover { color: #f0d9b5; }
#detail .d-avatar { font-size: 3rem; margin-bottom: 0.4rem; text-align: center; }
#detail .d-name { font-size: 1.3rem; font-weight: 700; color: #f0d9b5; text-align: center; }
#detail .d-alias { font-size: 0.8rem; color: #a07850; text-align: center; margin-bottom: 0.8rem; }
#detail .d-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
#detail .d-tag { padding: 0.2rem 0.6rem; border-radius: 10px; font-size: 0.72rem; }
#detail h4 { font-size: 0.72rem; color: #7a6040; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.9rem 0 0.4rem; }
#detail .d-desc { font-size: 0.83rem; color: #c8a97a; line-height: 1.7; }
#detail .d-rel { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid #2a1810; cursor: pointer; }
#detail .d-rel:last-child { border-bottom: none; }
#detail .d-rel-name { font-size: 0.83rem; color: #f0d9b5; }
#detail .d-rel-type { font-size: 0.75rem; color: #a07850; }
#detail .d-rel:hover .d-rel-name { color: #e8a84a; }

/* ── Mobile overlay ── */
@media (max-width: 680px) {
  #detail { width: 100%; border-left: none; border-top: 1px solid #3d2510; top: auto; height: 60vh; transform: translateY(100%); }
  #detail.open { transform: translateY(0); }
}

/* tag colors */
.tag-red    { background: #3d1010; color: #e08080; }
.tag-pink   { background: #3d1030; color: #e080c0; }

.tag-gray   { background: #252520; color: #a0a090; }

</style>

  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs||{})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

// ═══════════════════════════════════════════════════
//  LAYOUT CALCULATION
// ═══════════════════════════════════════════════════
function calcPositions(people, W, H) {
  const byLevel = {};
  people.forEach(p => {
    if (!byLevel[p.level]) byLevel[p.level] = [];
    byLevel[p.level].push(p.id);
  });
  const positions = {};
  for (const [lvl, ids] of Object.entries(byLevel)) {
    const y = LEVEL_Y[lvl] * H;
    const n = ids.length;
    // spread horizontally with padding
    const pad = W * 0.1;
    const step = (W - pad*2) / Math.max(n-1, 1);
    ids.forEach((id, i) => {
      const x = n === 1 ? W/2 : pad + i * step;
      positions[id] = { x, y };
    });
  }
  return positions;
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
let mainG, edgeG, nodeG;

function renderGraph() {
  svg.innerHTML = "";
  const W = svg.clientWidth || window.innerWidth;
  const H = svg.clientHeight || (window.innerHeight - 50);

  nodePositions = calcPositions(currentUniverse.people, W, H);

  // Defs: markers, gradients
  const defs = el('defs', {}, svg);

  // arrowhead marker per color (approximate, reuse a few)
  const markerColors = ["#e85a5a","#c88050","#a07850","#6090a0","#806090","#507090","#a05070","#706080"];
  markerColors.forEach(c => {
    const mid = c.replace('#','');
    const mk = el('marker', { id:'arr-'+mid, markerWidth:'8', markerHeight:'6', refX:'7', refY:'3', orient:'auto' }, defs);
    el('polygon', { points:'0 0, 8 3, 0 6', fill:c, opacity:'0.7' }, mk);
  });

  // glow filter
  const flt = el('filter', { id:'glow', x:'-50%', y:'-50%', width:'200%', height:'200%' }, defs);
  const feg = el('feGaussianBlur', { stdDeviation:'4', result:'blur' }, flt);
  const fem = el('feMerge', {}, flt);
  el('feMergeNode', { in:'blur' }, fem);
  el('feMergeNode', { in:'SourceGraphic' }, fem);

  // Main transform group
  mainG = el('g', { id:'mainG' }, svg);
  applyTransform();

  edgeG = el('g', { id:'edgeG' }, mainG);
  nodeG = el('g', { id:'nodeG' }, mainG);

  renderEdges();
  renderNodes();
  updateVisibility();
}

function markerRef(color) {
  const candidates = ["#e85a5a","#c88050","#a07850","#6090a0","#806090","#507090","#a05070","#706080"];
  // find closest
  return 'url(#arr-' + (candidates.includes(color) ? color : candidates[4]).replace('#','') + ')';
}

function renderEdges() {
  edgeG.innerHTML = "";
  currentUniverse.edges.forEach((e, i) => {
    const a = nodePositions[e.s], b = nodePositions[e.t];
    if (!a || !b) return;

    // curved path: control point offset perpendicular
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.sqrt(dx*dx+dy*dy) || 1;
    // perpendicular offset (slight curve)
    const offset = len * 0.12;
    const cx = mx - dy/len * offset;
    const cy = my + dx/len * offset;

    const path = el('path', {
      d: `M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,
      fill: 'none',
      stroke: e.color || '#a07850',
      'stroke-width': e.width || 1,
      'stroke-linecap': 'round',
      'marker-end': markerRef(e.color || '#a07850'),
      class: 'edge',
      'data-s': e.s, 'data-t': e.t,
      'data-label': e.label
    }, edgeG);

    // edge label on midpoint
    const labelG = el('g', { class:'edge-label-g', opacity:'0' }, edgeG);
    const txt = el('text', {
      x: cx, y: cy - 5,
      'text-anchor':'middle',
      fill: e.color || '#a07850',
      'font-size': '9',
      'pointer-events': 'none'
    }, labelG);
    txt.textContent = e.label;
    path._labelG = labelG;
  });
}

function renderNodes() {
  nodeG.innerHTML = "";
  currentUniverse.people.forEach(p => {
    const pos = nodePositions[p.id];
    if (!pos) return;
    const r = LEVEL_RADIUS[p.level] || 22;
    const fs = LEVEL_FONT[p.level] || 11;

    const g = el('g', {
      class: 'node-group',
      'data-id': p.id,
      transform: `translate(${pos.x},${pos.y})`
    }, nodeG);

    // glow ring (hidden by default, show on hover)
    el('circle', { r: r+6, fill:'none', stroke: p.color, 'stroke-width':'2', opacity:'0', class:'glow-ring' }, g);

    // background circle
    el('circle', { r, fill: p.color, opacity:'0.9', class:'node-bg', filter: p.level===0 ? 'url(#glow)' : '' }, g);

    // avatar text
    const av = el('text', { 'text-anchor':'middle', 'dominant-baseline':'central', 'font-size': r*0.85, 'pointer-events':'none', y:'-1' }, g);
    av.textContent = p.avatar;

    // name below
    const nm = el('text', {
      'text-anchor':'middle', y: r+fs+2,
      fill:'#f0d9b5', 'font-size': fs,
      'font-weight': p.level===0 ? '700' : '400',
      'pointer-events':'none', class:'node-label'
    }, g);
    nm.textContent = p.name;

    // level badge for level 0
    if (p.level === 0) {
      el('circle', { r:5, cx: r-2, cy: -(r-2), fill:'#e8a84a' }, g);
    }

    // interaction
    g.addEventListener('mouseenter', ev => onNodeHover(p.id, ev));
    g.addEventListener('mouseleave', () => onNodeLeave());
    g.addEventListener('click', ev => { ev.stopPropagation(); onNodeClick(p.id); });
    g.addEventListener('touchend', ev => { ev.preventDefault(); onNodeClick(p.id); });
  });
}

// ═══════════════════════════════════════════════════
//  VISIBILITY / HIGHLIGHT
// ═══════════════════════════════════════════════════
function updateVisibility() {
  if (!nodeG) return;
  const activeId = hoveredId || selectedId;
  const q = searchQ.toLowerCase();

  // find connected ids
  let connected = new Set();
  let connectedEdges = new Set();
  if (activeId) {
    connected.add(activeId);
    currentUniverse.edges.forEach((e, i) => {
      if (e.s === activeId || e.t === activeId) {
        connected.add(e.s); connected.add(e.t);
        connectedEdges.add(i);
      }
    });
  }

  // nodes
  nodeG.querySelectorAll('.node-group').forEach(g => {
    const id = g.dataset.id;
    const matchSearch = !q || currentUniverse.people.find(p=>p.id===id && (p.name.includes(q)||p.alias.includes(q)||p.brief.includes(q)));
    const inConnected = !activeId || connected.has(id);
    const show = matchSearch && inConnected;
    g.classList.toggle('faded', !show);
    g.classList.toggle('hovered', id === activeId);

    // glow ring
    const ring = g.querySelector('.glow-ring');
    if (ring) ring.setAttribute('opacity', id === activeId ? '0.6' : '0');
  });

  // edges
  const allEdgePaths = edgeG.querySelectorAll('.edge');
  const allLabels = edgeG.querySelectorAll('.edge-label-g');
  allEdgePaths.forEach((path, i) => {
    const isConn = !activeId || connectedEdges.has(i);
    const isDirectlyConn = activeId && (path.dataset.s === activeId || path.dataset.t === activeId);
    path.classList.toggle('highlighted', isDirectlyConn);
    path.classList.toggle('faded', !isConn && !!activeId);
    if (allLabels[i]) {
      allLabels[i].setAttribute('opacity', isDirectlyConn ? '1' : '0');
    }
  });
}

// ═══════════════════════════════════════════════════
//  INTERACTIONS
// ═══════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

function onNodeHover(id, ev) {
  hoveredId = id;
  updateVisibility();
  const p = currentUniverse.people.find(x => x.id === id);
  if (!p) return;

  const relRows = currentUniverse.edges
    .filter(e => e.s === id || e.t === id)
    .map(e => {
      const otherId = e.s === id ? e.t : e.s;
      const other = currentUniverse.people.find(x => x.id === otherId);
      return `<div class="tt-rel-item"><span class="tt-rel-name">${other?.name||otherId}</span><span>${e.label}</span></div>`;
    }).join('');

  const tagsHTML = p.tags.map(t => `<span class="tt-tag ${t.c}">${t.l}</span>`).join('');

  tooltip.innerHTML = `
    <div class="tt-name">${p.avatar} ${p.name}</div>
    <div class="tt-alias">${p.alias}</div>
    <div class="tt-tags">${tagsHTML}</div>
    <div class="tt-desc">${p.brief}</div>
    ${relRows ? `<div class="tt-rels"><h4>关系</h4>${relRows}</div>` : ''}
  `;
  positionTooltip(ev);
  tooltip.classList.add('show');
}

function onNodeLeave() {
  hoveredId = null;
  updateVisibility();
  tooltip.classList.remove('show');
}

function positionTooltip(ev) {
  const W = window.innerWidth, H = window.innerHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
  // adjust if offscreen
  const rect = tooltip.getBoundingClientRect();
  if (rect.right > W - 10) tooltip.style.left = (ev.clientX - rect.width - 14) + 'px';
  if (rect.bottom > H - 10) tooltip.style.top = (ev.clientY - rect.height - 14) + 'px';
}

document.addEventListener('mousemove', ev => {
  if (tooltip.classList.contains('show')) positionTooltip(ev);
});

function onNodeClick(id) {
  selectedId = selectedId === id ? null : id;
  updateVisibility();
  if (selectedId) openDetail(selectedId);
  else closeDetail();
}

// ═══════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════
const detail = document.getElementById('detail');
const detailContent = document.getElementById('detailContent');

function openDetail(id) {
  const p = currentUniverse.people.find(x => x.id === id);
  if (!p) return;
  const tagsHTML = p.tags.map(t => `<span class="d-tag ${t.c}">${t.l}</span>`).join('');
  const relRows = currentUniverse.edges
    .filter(e => e.s === id || e.t === id)
    .map(e => {
      const otherId = e.s === id ? e.t : e.s;
      const other = currentUniverse.people.find(x => x.id === otherId);
      return `<div class="d-rel" data-id="${otherId}">
        <span class="d-rel-name">${other?.avatar||''} ${other?.name||otherId}</span>
        <span class="d-rel-type">${e.label}</span>
      </div>`;
    }).join('');

  detailContent.innerHTML = `
    <div class="d-avatar">${p.avatar}</div>
    <div class="d-name">${p.name}</div>
    <div class="d-alias">${p.alias}</div>
    <div class="d-tags">${tagsHTML}</div>
    <h4>简介</h4>
    <div class="d-desc">${p.detail}</div>
    ${relRows ? `<h4>关系网络</h4>${relRows}` : ''}
  `;
  detail.classList.add('open');

  // click relation → jump to that person
  detailContent.querySelectorAll('.d-rel').forEach(row => {
    row.addEventListener('click', () => {
      onNodeClick(row.dataset.id);
      panToNode(row.dataset.id);
    });
  });
}

function closeDetail() {
  detail.classList.remove('open');
  selectedId = null;
  updateVisibility();
}

document.getElementById('detailClose').addEventListener('click', closeDetail);

function panToNode(id) {
  const pos = nodePositions[id];
  if (!pos) return;
  const W = svg.clientWidth, H = svg.clientHeight;
  transform.x = W/2 - pos.x * transform.scale;
  transform.y = H/2 - pos.y * transform.scale;
  applyTransform(true);
}

// ═══════════════════════════════════════════════════
//  PAN & ZOOM
// ═══════════════════════════════════════════════════
function applyTransform(animate) {
  if (!mainG) return;
  if (animate) { mainG.style.transition = 'transform 0.35s'; setTimeout(()=>mainG.style.transition='',400); }
  mainG.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}

svg.addEventListener('mousedown', ev => {
  if (ev.button !== 0) return;
  isPanning = true;
  panStart = { x: ev.clientX, y: ev.clientY };
  panOrigin = { x: transform.x, y: transform.y };
  svg.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if (!isPanning) return;
  transform.x = panOrigin.x + (ev.clientX - panStart.x);
  transform.y = panOrigin.y + (ev.clientY - panStart.y);
  applyTransform();
});
window.addEventListener('mouseup', () => { isPanning = false; svg.classList.remove('panning'); });

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const delta = ev.deltaY < 0 ? 1.1 : 0.91;
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  transform.x = mx - (mx - transform.x) * delta;
  transform.y = my - (my - transform.y) * delta;
  transform.scale = Math.min(3, Math.max(0.3, transform.scale * delta));
  applyTransform();
}, { passive: false });

// touch
let lastTouchDist = 0, lastTouchMid = null;
svg.addEventListener('touchstart', ev => {
  if (ev.touches.length === 1) {
    isPanning = true;
    panStart = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
    panOrigin = { x: transform.x, y: transform.y };
  } else if (ev.touches.length === 2) {
    isPanning = false;
    const dx = ev.touches[1].clientX - ev.touches[0].clientX;
    const dy = ev.touches[1].clientY - ev.touches[0].clientY;
    lastTouchDist = Math.sqrt(dx*dx+dy*dy);
    lastTouchMid = { x:(ev.touches[0].clientX+ev.touches[1].clientX)/2, y:(ev.touches[0].clientY+ev.touches[1].clientY)/2 };
  }
}, { passive: true });
svg.addEventListener('touchmove', ev => {
  ev.preventDefault();
  if (ev.touches.length === 1 && isPanning) {
    transform.x = panOrigin.x + (ev.touches[0].clientX - panStart.x);
    transform.y = panOrigin.y + (ev.touches[0].clientY - panStart.y);
    applyTransform();
  } else if (ev.touches.length === 2) {
    const dx = ev.touches[1].clientX - ev.touches[0].clientX;
    const dy = ev.touches[1].clientY - ev.touches[0].clientY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const delta = dist / (lastTouchDist || dist);
    const mid = { x:(ev.touches[0].clientX+ev.touches[1].clientX)/2, y:(ev.touches[0].clientY+ev.touches[1].clientY)/2 };
    const rect = svg.getBoundingClientRect();
    const mx = mid.x-rect.left, my = mid.y-rect.top;
    transform.x = mx - (mx - transform.x) * delta;
    transform.y = my - (my - transform.y) * delta;
    transform.scale = Math.min(3, Math.max(0.3, transform.scale * delta));
    lastTouchDist = dist; lastTouchMid = mid;
    applyTransform();
  }
}, { passive: false });
svg.addEventListener('touchend', () => { isPanning = false; });

svg.addEventListener('click', ev => {
  if (ev.target === svg || ev.target === mainG) { closeDetail(); hoveredId=null; updateVisibility(); }
});

// ═══════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════
document.getElementById('searchBox').addEventListener('input', ev => {
  searchQ = ev.target.value.trim();
  updateVisibility();
});

// ═══════════════════════════════════════════════════
//  UNIVERSE TABS
// ═══════════════════════════════════════════════════
const uTabs = document.getElementById('uTabs');
UNIVERSES.forEach(u => {
  const btn = document.createElement('button');
  btn.className = 'u-tab' + (u.id === UNIVERSES[0].id ? ' active' : '');
  btn.textContent = u.name;
  btn.addEventListener('click', () => {
    currentUniverse = u;
    uTabs.querySelectorAll('.u-tab').forEach(b => b.classList.toggle('active', b === btn));
    transform = { x:0, y:0, scale:1 };
    hoveredId = selectedId = null;
    closeDetail();
    renderGraph();
  });
  uTabs.appendChild(btn);
});

// ═══════════════════════════════════════════════════
//  RESET
// ═══════════════════════════════════════════════════
document.getElementById('btnReset').addEventListener('click', () => {
  transform = { x:0, y:0, scale:1 };
  applyTransform(true);
});

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
window.addEventListener('resize', () => renderGraph());
renderGraph();
</script>
