<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物关系 — Lightfor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body { margin:0; padding:0; overflow:hidden; background:#130c05; color:#e8d5b7; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
#app { display:flex; flex-direction:column; height:100vh; }

/* ── Header ── */
.header {
  display:flex; align-items:center; gap:0.75rem; padding:0.5rem 1rem;
  background:rgba(19,12,5,0.97); border-bottom:1px solid #3a2010;
  z-index:10; flex-shrink:0; flex-wrap:wrap;
}
.header a { color:#8a6840; font-size:0.78rem; text-decoration:none; white-space:nowrap; }
.header a:hover { color:#e8d5b7; }
.header h1 { font-size:0.95rem; color:#e8d5b7; font-weight:600; white-space:nowrap; margin:0; }
.hsep { color:#3a2010; }
.u-tabs { display:flex; gap:0.35rem; }
.u-tab { padding:0.25rem 0.75rem; border-radius:12px; font-size:0.78rem; border:1px solid #3a2010; background:transparent; color:#8a6840; cursor:pointer; transition:all 0.15s; }
.u-tab.active { background:#6a3a10; color:#f0d9b5; border-color:#6a3a10; }
.hright { margin-left:auto; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
.ctrl-btn { padding:0.22rem 0.65rem; border-radius:10px; font-size:0.73rem; border:1px solid #3a2010; background:transparent; color:#8a6840; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.ctrl-btn:hover,.ctrl-btn.on { background:#3a2010; color:#f0d9b5; }
.search-wrap { position:relative; }
.search-wrap input { background:#1e1208; border:1px solid #3a2010; color:#e8d5b7; border-radius:12px; padding:0.22rem 0.7rem 0.22rem 1.6rem; font-size:0.76rem; outline:none; width:130px; transition:border-color 0.2s; }
.search-wrap input:focus { border-color:#8a6840; }
.search-wrap::before { content:"🔍"; position:absolute; left:0.45rem; top:50%; transform:translateY(-50%); font-size:0.68rem; pointer-events:none; }

/* ── Legend ── */
.legend { display:flex; gap:0.7rem; align-items:center; }
.leg { display:flex; align-items:center; gap:0.3rem; font-size:0.68rem; color:#6a5030; white-space:nowrap; }
.leg-line { width:22px; height:2px; }
.leg-line.blood { background:#c8a060; }
.leg-line.marriage { background:#e87060; height:0; border-bottom:2px dashed #e87060; }
.leg-line.love { background:none; border-bottom:2px dotted #e85080; height:0; }
.leg-line.servant { background:none; border-bottom:1px dashed #7090a0; height:0; }

/* ── Canvas ── */
#canvas-wrap { flex:1; position:relative; overflow:hidden; }
svg#graph { width:100%; height:100%; cursor:grab; }
svg#graph.panning { cursor:grabbing; }

/* ── Node styles ── */
.node-group { cursor:pointer; }
.node-group.faded { opacity:0.1; transition:opacity 0.2s; }
.node-group.dim   { opacity:0.35; transition:opacity 0.2s; }
.node-group.lit   { opacity:1; transition:opacity 0.2s; }

/* ── Edge styles ── */
.edge { transition:opacity 0.2s, stroke-width 0.15s; }
.edge.faded { opacity:0.05; }
.edge.lit   { opacity:1; }

/* ── Tooltip ── */
#tooltip {
  position:fixed; z-index:200; background:rgba(15,8,2,0.97);
  border:1px solid #6a3a10; border-radius:12px; padding:0.8rem 0.95rem;
  max-width:270px; min-width:180px; pointer-events:none;
  opacity:0; transition:opacity 0.12s; box-shadow:0 8px 28px rgba(0,0,0,0.7);
}
#tooltip.show { opacity:1; }
.tt-name { font-size:1rem; font-weight:700; color:#f0d9b5; }
.tt-alias { font-size:0.72rem; color:#8a6840; margin-bottom:0.4rem; }
.tt-tags { display:flex; gap:0.28rem; flex-wrap:wrap; margin-bottom:0.4rem; }
.tt-tag { padding:0.12rem 0.45rem; border-radius:7px; font-size:0.68rem; }
.tt-desc { font-size:0.78rem; color:#b89060; line-height:1.55; margin-bottom:0.5rem; }
.tt-rels-title { font-size:0.65rem; color:#6a5030; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.25rem; }
.tt-rel { font-size:0.76rem; color:#a08050; padding:0.18rem 0; border-bottom:1px solid #1e1208; display:flex; justify-content:space-between; gap:0.5rem; }
.tt-rel:last-child { border-bottom:none; }
.tt-rel-name { color:#e8d5b7; }

/* ── Detail panel ── */
#detail {
  position:fixed; right:0; top:0; bottom:0; width:290px;
  background:rgba(12,7,2,0.98); border-left:1px solid #3a2010;
  z-index:150; transform:translateX(100%); transition:transform 0.22s;
  overflow-y:auto; padding:1.1rem 1rem;
}
#detail.open { transform:translateX(0); }
#detail .d-close { position:absolute; top:0.7rem; right:0.7rem; background:none; border:none; color:#6a5030; font-size:1rem; cursor:pointer; }
#detail .d-close:hover { color:#f0d9b5; }
.d-avatar { font-size:2.6rem; text-align:center; margin-bottom:0.3rem; }
.d-name { font-size:1.2rem; font-weight:700; color:#f0d9b5; text-align:center; }
.d-alias { font-size:0.76rem; color:#8a6840; text-align:center; margin-bottom:0.7rem; }
.d-tags { display:flex; gap:0.3rem; flex-wrap:wrap; justify-content:center; margin-bottom:0.9rem; }
.d-tag { padding:0.18rem 0.55rem; border-radius:9px; font-size:0.7rem; }
#detail h4 { font-size:0.68rem; color:#6a5030; text-transform:uppercase; letter-spacing:0.06em; margin:0.85rem 0 0.35rem; }
.d-desc { font-size:0.8rem; color:#b89060; line-height:1.65; }
.d-rel { display:flex; justify-content:space-between; padding:0.3rem 0; border-bottom:1px solid #1e1208; cursor:pointer; gap:0.5rem; }
.d-rel:last-child { border-bottom:none; }
.d-rel-name { font-size:0.8rem; color:#e8d5b7; }
.d-rel-type { font-size:0.72rem; color:#8a6840; text-align:right; }
.d-rel:hover .d-rel-name { color:#e8a840; }

@media (max-width:680px) {
  #detail { width:100%; border-left:none; border-top:1px solid #3a2010; top:auto; height:58vh; transform:translateY(100%); }
  #detail.open { transform:translateY(0); }
  .legend { display:none; }
  .header { padding:0.35rem 0.6rem; gap:0.4rem; }
  .header h1 { font-size:0.82rem; }
  .hright { margin-left:0; width:100%; justify-content:flex-end; }
  .u-tabs { flex-wrap:wrap; }
  .u-tab { padding:0.2rem 0.55rem; font-size:0.72rem; }
  .ctrl-btn { padding:0.18rem 0.5rem; font-size:0.68rem; }
  .search-wrap input { width:100px; font-size:0.72rem; }
}

/* tag palette */
.tg-red  { background:#3a0f0f; color:#e07070; }
.tg-pink { background:#3a0f28; color:#e070b8; }
.tg-blue { background:#0f1e3a; color:#7098d8; }
.tg-gold { background:#281808; color:#d0a030; }
.tg-gray { background:#222018; color:#9a9080; }
.tg-teal { background:#082028; color:#60a8b8; }
</style>
</head>

<div id="tooltip"></div>

//  LAYOUT
//  Each person has gen (row) and branch (x-group).
//  Branches are ordered left→right, people within branch left→right.
// ═══════════════════════════════════════════════════════════════

// Branch order (left to right)
const BRANCH_ORDER = ["jia-ning","jia-she","jia-zheng","jia-rong","lin","shi","miao","wang","xue"];
const GEN_Y_FRAC   = [0.07, 0.22, 0.42, 0.65, 0.83]; // up to gen 4
function getNodeR() {
  return window.innerWidth <= 680
    ? { ghost:8, normal:14, key:18 }
    : { ghost:12, normal:22, key:28 };
}
let NODE_R = getNodeR();

// Key people (larger nodes)
const KEY_PEOPLE = new Set(["jbaoyu","ldaiyu","xbaochai","wxifeng","jmu","sxiangyun","qkeqing"]);

function calcPositions(people, W, H) {
  // group by branch then gen
  const branchGen = {}; // branch -> gen -> [id]
  people.forEach(p => {
    const b = p.branch || "other";
    if (!branchGen[b]) branchGen[b] = {};
    if (!branchGen[b][p.gen]) branchGen[b][p.gen] = [];
    branchGen[b][p.gen].push(p.id);
  });

  // assign x-slots per branch
  // count max people per branch across all gens
  const branchWidth = {}; // branch -> slot count
  BRANCH_ORDER.forEach(b => {
    if (!branchGen[b]) { branchWidth[b] = 0; return; }
    const maxInBranch = Math.max(...Object.values(branchGen[b]).map(a=>a.length));
    branchWidth[b] = maxInBranch;
  });
  // also handle branches not in BRANCH_ORDER
  Object.keys(branchGen).forEach(b => {
    if (!(b in branchWidth)) {
      const maxInBranch = Math.max(...Object.values(branchGen[b]).map(a=>a.length));
      branchWidth[b] = maxInBranch;
      BRANCH_ORDER.push(b);
    }
  });

  const PAD_X = Math.min(70, W * 0.05), PAD_Y = 60;
  const usableW = W - PAD_X * 2;
  const totalSlots = BRANCH_ORDER.reduce((s,b) => s + Math.max(branchWidth[b]||0, 1), 0);
  const minSlotW = (NODE_R.key + 10) * 2;   // at least diameter + gap
  const slotW = Math.max(usableW / totalSlots, minSlotW);

  // branch start x
  let cursor = PAD_X;
  const branchStartX = {};
  BRANCH_ORDER.forEach(b => {
    branchStartX[b] = cursor;
    cursor += Math.max(branchWidth[b]||0, 1) * slotW;
  });

  // gen y
  const maxGen = Math.max(...people.map(p=>p.gen));
  const minGenStep = (NODE_R.key + 14) * 2;
  const naturalH = H - PAD_Y * 2;
  const genStep = maxGen <= 0 ? naturalH : Math.max(naturalH / maxGen, minGenStep);

  const positions = {};
  people.forEach(p => {
    const b = p.branch || "other";
    const ids = branchGen[b][p.gen];
    const idx = ids.indexOf(p.id);
    const n = ids.length;
    const bw = Math.max(branchWidth[b]||0, 1) * slotW;
    const xStep = bw / (n + 1);
    const x = branchStartX[b] + xStep * (idx + 1);
    const y = PAD_Y + p.gen * genStep;
    positions[p.id] = { x, y };
  });
  return { positions, PAD_Y, genStep };
}

const svg = document.getElementById('graph');
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs||{})) e.setAttribute(k,v);
  if (parent) parent.appendChild(e);
  return e;
}

let mainG, edgeG, nodeG;

function renderGraph() {
  NODE_R = getNodeR();
  svg.innerHTML = "";
  const W = svg.clientWidth  || window.innerWidth;
  const H = svg.clientHeight || (window.innerHeight - 46);
  const layout = calcPositions(CU.people, W, H);
  nodePositions = layout.positions;

  const defs = el('defs',{},svg);
  // glow filter
  const flt = el('filter',{id:'glow',x:'-60%',y:'-60%',width:'220%',height:'220%'},defs);
  const gb = el('feGaussianBlur',{stdDeviation:'5',result:'blur'},flt);
  const fm = el('feMerge',{},flt);
  el('feMergeNode',{in:'blur'},fm); el('feMergeNode',{in:'SourceGraphic'},fm);

  mainG = el('g',{id:'mainG'},svg);
  applyTransform();
  edgeG = el('g',{id:'edgeG'},mainG);
  nodeG = el('g',{id:'nodeG'},mainG);

  // generation labels (background)
  const genNames = ["曾祖辈","祖父辈","父母辈","子辈","孙辈"];
  const maxGen = Math.max(...CU.people.map(p=>p.gen));
  for (let g=0; g<=maxGen; g++) {
    const y = layout.PAD_Y + g * layout.genStep;
    const lbl = el('text',{ x:'8', y:y, fill:'#3a2810', 'font-size':'11', 'font-weight':'600',
      'dominant-baseline':'middle', 'pointer-events':'none', 'user-select':'none' }, mainG);
    lbl.textContent = genNames[g] || `第${g}代`;
    // horizontal rule
    el('line',{ x1:'0', y1:y, x2:W*10, y2:y, stroke:'#2a1808', 'stroke-width':'1',
      'pointer-events':'none' }, mainG);
  }

  renderEdges();
  renderNodes();
  updateVisibility();
}

function renderEdges() {
  edgeG.innerHTML = "";
  CU.edges.forEach((e,i) => {
    const a = nodePositions[e.s], b = nodePositions[e.t];
    if (!a || !b) return;
    const st = EDGE_STYLE[e.type] || EDGE_STYLE.blood;

    // curve offset so parallel edges don't overlap
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy)||1;
    const curveAmt = e.type==='marriage' ? len*0.08 : len*0.05;
    const cx = mx - (dy/len)*curveAmt;
    const cy = my + (dx/len)*curveAmt;

    const path = el('path',{
      d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,
      fill:'none', stroke:st.stroke, 'stroke-width':st.width,
      'stroke-dasharray':st.dash, 'stroke-linecap':'round',
      opacity:st.opacity, class:'edge',
      'data-s':e.s,'data-t':e.t,'data-type':e.type,'data-label':e.label
    }, edgeG);

    // label (hidden by default)
    const lg = el('g',{class:'edge-lbl',opacity:'0','pointer-events':'none'},edgeG);
    // bg rect for readability
    const txt = el('text',{ x:cx, y:cy-5, 'text-anchor':'middle', fill:st.stroke,
      'font-size':'9', 'dominant-baseline':'auto' }, lg);
    txt.textContent = e.label;
    path._lg = lg;
    path._edgeIdx = i;
  });
}

function renderNodes() {
  nodeG.innerHTML = "";
  CU.people.forEach(p => {
    const pos = nodePositions[p.id];
    if (!pos) return;
    const isKey   = KEY_PEOPLE.has(p.id);
    const isGhost = !!p.ghost;
    const r = isGhost ? NODE_R.ghost : isKey ? NODE_R.key : NODE_R.normal;
    const fs = isGhost ? 9 : isKey ? 13 : 11;

    const g = el('g',{ class:'node-group', 'data-id':p.id,
      transform:`translate(${pos.x},${pos.y})` }, nodeG);

    // invisible hit-area — ensures 44px touch target regardless of visual size
    const hitR = Math.max(r, 22);
    el('circle',{r:hitR, fill:'transparent', stroke:'none', 'pointer-events':'all'}, g);

    if (isGhost) {
      // ghost: dashed circle, muted
      el('circle',{r,fill:'#1a1005',stroke:'#4a3020','stroke-width':'1.5',
        'stroke-dasharray':'4,3',opacity:'0.7'},g);
      const av=el('text',{'text-anchor':'middle','dominant-baseline':'central',
        'font-size':Math.max(r*0.85, 9),'pointer-events':'none'},g);
      av.textContent=p.avatar;
      const nm=el('text',{'text-anchor':'middle',y:hitR+fs+1,fill:'#7a6040',
        'font-size':Math.max(fs,9),'pointer-events':'none',class:'node-label'},g);
      nm.textContent=p.name;
    } else {
      // glow ring
      el('circle',{r:r+7,fill:'none',stroke:'#e8a840','stroke-width':'1.5',
        opacity:'0',class:'glow-ring'},g);
      // main circle

      el('circle',{r,fill:fillColor,stroke:strokeColor,'stroke-width': isKey?'2':'1.5',
        class:'node-bg', filter:isKey?'url(#glow)':''},g);
      // avatar
      const av=el('text',{'text-anchor':'middle','dominant-baseline':'central',
        'font-size':r*0.78,'pointer-events':'none'},g);
      av.textContent=p.avatar;
      // name
      const nm=el('text',{'text-anchor':'middle',y:hitR+fs+2,fill:'#e8d5b7',
        'font-size':fs,'font-weight':isKey?'700':'400',
        'pointer-events':'none',class:'node-label'},g);
      nm.textContent=p.name;
    }

    g.addEventListener('mouseenter', ev => onHover(p.id, ev));
    g.addEventListener('mouseleave', onLeave);
    g.addEventListener('click', ev => { ev.stopPropagation(); onClick(p.id); });
    g.addEventListener('touchend', ev => { ev.preventDefault(); if(!touchMoved) onClick(p.id); });
  });
}

// ═══════════════════════════════════════════════════════════════
//  VISIBILITY
// ═══════════════════════════════════════════════════════════════
function updateVisibility() {
  if (!nodeG) return;
  const activeId = hoveredId || selectedId;
  const q = searchQ.toLowerCase();

  // build connected set
  const connNodes = new Set();
  const connEdges = new Set();
  if (activeId) {
    connNodes.add(activeId);
    CU.edges.forEach((e,i) => {
      if (e.s===activeId||e.t===activeId) {
        connNodes.add(e.s); connNodes.add(e.t); connEdges.add(i);
      }
    });
  }

  nodeG.querySelectorAll('.node-group').forEach(g => {
    const id = g.dataset.id;
    const p = CU.people.find(x=>x.id===id);
    const matchQ = !q || (p && (p.name.includes(q)||p.alias.includes(q)||(p.brief||'').includes(q)));
    const inConn = !activeId || connNodes.has(id);
    if (!matchQ) { g.className.baseVal = 'node-group faded'; return; }
    if (!inConn)  { g.className.baseVal = 'node-group dim';   return; }
    g.className.baseVal = 'node-group lit';
    // glow ring
    const ring = g.querySelector('.glow-ring');
    if (ring) ring.setAttribute('opacity', id===activeId ? '0.7' : '0');
  });

  const paths = edgeG.querySelectorAll('.edge');
  const lbls  = edgeG.querySelectorAll('.edge-lbl');
  paths.forEach((path,i) => {
    const isConn = !activeId || connEdges.has(i);
    const isDirect = activeId && (path.dataset.s===activeId||path.dataset.t===activeId);
    path.classList.toggle('faded', !isConn && !!activeId);
    path.classList.toggle('lit',   isConn);
    const st = EDGE_STYLE[path.dataset.type]||EDGE_STYLE.blood;
    path.setAttribute('stroke-width', isDirect ? st.width * 1.8 : st.width);
    if (lbls[i]) lbls[i].setAttribute('opacity', isDirect?'1':'0');
  });
}

// ═══════════════════════════════════════════════════════════════
//  HOVER / CLICK
// ═══════════════════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

function onHover(id, ev) {
  hoveredId = id;
  updateVisibility();
  const p = CU.people.find(x=>x.id===id);
  if (!p||p.ghost) { tooltip.classList.remove('show'); return; }
  const tagsH = p.tags.map(t=>`<span class="tt-tag ${t.c}">${t.l}</span>`).join('');
  const rels = CU.edges.filter(e=>e.s===id||e.t===id).map(e=>{
    const oid = e.s===id?e.t:e.s;
    const o = CU.people.find(x=>x.id===oid);
    return `<div class="tt-rel"><span class="tt-rel-name">${o?.avatar||''} ${o?.name||oid}</span><span>${e.label}</span></div>`;
  }).join('');
  tooltip.innerHTML = `
    <div class="tt-name">${p.avatar} ${p.name}</div>
    <div class="tt-alias">${p.alias}</div>
    <div class="tt-tags">${tagsH}</div>
    <div class="tt-desc">${p.brief}</div>
    ${rels?`<div class="tt-rels-title">直接关系</div>${rels}`:''}
  `;
  posTooltip(ev);
  tooltip.classList.add('show');
}

function onLeave() {
  hoveredId = null; updateVisibility(); tooltip.classList.remove('show');
}

function posTooltip(ev) {
  const W=window.innerWidth,H=window.innerHeight;
  tooltip.style.left=(ev.clientX+14)+'px'; tooltip.style.top=(ev.clientY+14)+'px';
  requestAnimationFrame(()=>{
    const r=tooltip.getBoundingClientRect();
    if(r.right>W-8)  tooltip.style.left=(ev.clientX-r.width-14)+'px';
    if(r.bottom>H-8) tooltip.style.top =(ev.clientY-r.height-14)+'px';
  });
}
document.addEventListener('mousemove', ev => { if(tooltip.classList.contains('show')) posTooltip(ev); });

function onClick(id) {
  if (id===selectedId) { closeDetail(); return; }
  selectedId = id;
  updateVisibility();
  openDetail(id);
}

// ═══════════════════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════════
const detail = document.getElementById('detail');
const detailContent = document.getElementById('detailContent');

function openDetail(id) {
  const p = CU.people.find(x=>x.id===id);
  if (!p) return;
  const tagsH = p.tags.map(t=>`<span class="d-tag ${t.c}">${t.l}</span>`).join('');
  const rels = CU.edges.filter(e=>e.s===id||e.t===id).map(e=>{
    const oid=e.s===id?e.t:e.s;
    const o=CU.people.find(x=>x.id===oid);
    const st=EDGE_STYLE[e.type]||EDGE_STYLE.blood;
    return `<div class="d-rel" data-id="${oid}">
      <span class="d-rel-name">${o?.avatar||''} ${o?.name||oid}</span>
      <span class="d-rel-type" style="color:${st.stroke}">${e.label}</span>
    </div>`;
  }).join('');
  detailContent.innerHTML = `
    <div class="d-avatar">${p.avatar}</div>
    <div class="d-name">${p.name}</div>
    <div class="d-alias">${p.alias}</div>
    <div class="d-tags">${tagsH}</div>
    <h4>简介</h4>
    <div class="d-desc">${p.detail||p.brief}</div>
    ${rels?`<h4>直接关系</h4>${rels}`:''}
  `;
  detail.classList.add('open');
  detailContent.querySelectorAll('.d-rel').forEach(row=>{
    row.addEventListener('click',()=>{ onClick(row.dataset.id); panTo(row.dataset.id); });
  });
}

function closeDetail() {
  detail.classList.remove('open');
  selectedId=null; updateVisibility();
}
document.getElementById('detailClose').addEventListener('click', closeDetail);

function panTo(id) {
  const pos=nodePositions[id]; if(!pos) return;
  const W=svg.clientWidth,H=svg.clientHeight;
  transform.x=W/2-pos.x*transform.scale;
  transform.y=H/2-pos.y*transform.scale;
  applyTransform(true);
}

// ═══════════════════════════════════════════════════════════════
//  PAN / ZOOM
// ═══════════════════════════════════════════════════════════════
function applyTransform(animate) {
  if (!mainG) return;
  if (animate) { mainG.style.transition='transform 0.3s'; setTimeout(()=>mainG.style.transition='',350); }
  mainG.setAttribute('transform',`translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}

svg.addEventListener('mousedown', ev=>{
  if(ev.button!==0)return;
  isPanning=true; panStart={x:ev.clientX,y:ev.clientY}; panOrigin={x:transform.x,y:transform.y};
  svg.classList.add('panning');
});
window.addEventListener('mousemove', ev=>{
  if(!isPanning)return;
  transform.x=panOrigin.x+(ev.clientX-panStart.x);
  transform.y=panOrigin.y+(ev.clientY-panStart.y);
  applyTransform();
});
window.addEventListener('mouseup',()=>{ isPanning=false; svg.classList.remove('panning'); });
svg.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const d=ev.deltaY<0?1.1:0.91;
  const r=svg.getBoundingClientRect();
  const mx=ev.clientX-r.left, my=ev.clientY-r.top;
  transform.x=mx-(mx-transform.x)*d;
  transform.y=my-(my-transform.y)*d;
  transform.scale=Math.min(4,Math.max(0.25,transform.scale*d));
  applyTransform();
},{passive:false});

let lastDist=0, touchMoved=false;
svg.addEventListener('touchstart',ev=>{
  touchMoved=false;
  if(ev.touches.length===1){ isPanning=true; panStart={x:ev.touches[0].clientX,y:ev.touches[0].clientY}; panOrigin={x:transform.x,y:transform.y}; }
  else if(ev.touches.length===2){ isPanning=false; const dx=ev.touches[1].clientX-ev.touches[0].clientX,dy=ev.touches[1].clientY-ev.touches[0].clientY; lastDist=Math.sqrt(dx*dx+dy*dy); }
},{passive:true});
svg.addEventListener('touchmove',ev=>{
  ev.preventDefault();
  if(ev.touches.length===1&&isPanning){
    const dx=ev.touches[0].clientX-panStart.x, dy=ev.touches[0].clientY-panStart.y;
    if(Math.sqrt(dx*dx+dy*dy)>5) touchMoved=true;
    transform.x=panOrigin.x+dx; transform.y=panOrigin.y+dy; applyTransform();
  } else if(ev.touches.length===2){ touchMoved=true; const dx=ev.touches[1].clientX-ev.touches[0].clientX,dy=ev.touches[1].clientY-ev.touches[0].clientY,dist=Math.sqrt(dx*dx+dy*dy),d=dist/(lastDist||dist); const mid={x:(ev.touches[0].clientX+ev.touches[1].clientX)/2,y:(ev.touches[0].clientY+ev.touches[1].clientY)/2}; const r=svg.getBoundingClientRect(),mx=mid.x-r.left,my=mid.y-r.top; transform.x=mx-(mx-transform.x)*d; transform.y=my-(my-transform.y)*d; transform.scale=Math.min(4,Math.max(0.25,transform.scale*d)); lastDist=dist; applyTransform(); }
},{passive:false});
svg.addEventListener('touchend',()=>{ isPanning=false; });

svg.addEventListener('click',ev=>{ if(ev.target===svg||ev.target===mainG){ closeDetail(); hoveredId=null; updateVisibility(); } });

// ═══════════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════════
document.getElementById('searchBox').addEventListener('input',ev=>{ searchQ=ev.target.value.trim(); updateVisibility(); });
document.getElementById('btnReset').addEventListener('click',()=>{ transform={x:0,y:0,scale:1}; applyTransform(true); });

const uTabs=document.getElementById('uTabs');
UNIVERSES.forEach(u=>{
  const btn=document.createElement('button');
  btn.className='u-tab'+(u.id===UNIVERSES[0].id?' active':'');
  btn.textContent=u.name;
  btn.addEventListener('click',()=>{
    CU=u; uTabs.querySelectorAll('.u-tab').forEach(b=>b.classList.toggle('active',b===btn));
    transform={x:0,y:0,scale:1}; hoveredId=selectedId=null; closeDetail(); renderGraph();
  });
  uTabs.appendChild(btn);
});

window.addEventListener('resize',()=>renderGraph());
renderGraph();
</script>
