<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大熊猫名录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f0eb; color: #333; padding: 1rem; }
  h1 { text-align: center; font-size: 1.6rem; margin-bottom: 0.3rem; color: #4a3728; }
  .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
  .search-wrap { display: flex; justify-content: center; margin-bottom: 1rem; }
  #search { width: 100%; max-width: 400px; padding: 0.5rem 1rem; border: 1px solid #d4c5b0; border-radius: 20px; font-size: 1rem; outline: none; background: #fff; }
  #search:focus { border-color: #8b5e3c; }
  .count { text-align: center; color: #888; font-size: 0.82rem; margin-bottom: 1rem; }

  /* Desktop: table */
  .table-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  table { width: 100%; border-collapse: collapse; background: #fff; min-width: 700px; }
  thead tr { background: #6b4226; color: #fff; }
  th { padding: 0.65rem 0.8rem; text-align: left; font-weight: 600; white-space: nowrap; }
  td { padding: 0.5rem 0.8rem; border-bottom: 1px solid #f0e8df; white-space: nowrap; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fdf6ef; }
  .female { color: #c0576a; }
  .male { color: #3a7abf; }
  .alias { color: #888; font-size: 0.82rem; }
  .avatar { width: 80px; height: 80px; border-radius: 6px; object-fit: cover; display: block; }
  .avatar-placeholder { width: 80px; height: 80px; border-radius: 6px; background: #e8ddd3; display: flex; align-items: center; justify-content: center; font-size: 2rem; }

  /* Mobile: cards */
  .cards-wrap { display: none; }
  .panda-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 0.9rem; display: flex; gap: 0.9rem; align-items: flex-start; margin-bottom: 0.8rem; }
  .panda-card img, .panda-card .card-avatar-ph { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .card-avatar-ph { background: #e8ddd3; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 1.1rem; font-weight: 700; color: #4a3728; }
  .card-alias { font-size: 0.8rem; color: #888; margin-bottom: 0.3rem; }
  .card-meta { font-size: 0.82rem; color: #555; line-height: 1.7; }
  .card-meta span { margin-right: 0.6rem; }
  .tag-female { color: #c0576a; }
  .tag-male { color: #3a7abf; }

  .back-link { display: inline-flex; align-items: center; gap: 4px; color: #888; font-size: 0.82rem; text-decoration: none; margin-bottom: 0.5rem; transition: color 0.2s; }
  .back-link:hover { color: #4a3728; }

  @media (max-width: 680px) {
    body { padding: 0.75rem; }
    .table-wrap { display: none; }
    .cards-wrap { display: block; }
  }
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回首页</a>
<h1>🐼 大熊猫名录</h1>
<p class="subtitle">共 <span id="total"></span> 只</p>
<div class="search-wrap">
  <input id="search" type="search" placeholder="搜索姓名、别名、动物园…">
</div>
<p class="count">显示 <span id="shown"></span> / <span id="total2"></span> 条</p>

<!-- Desktop table -->
<div class="table-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th>#</th><th>照片</th><th>姓名</th><th>别名</th><th>动物园</th>
        <th>展馆</th><th>性别</th><th>母亲</th><th>父亲</th><th>生日</th><th>谱系号</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Mobile cards -->
<div class="cards-wrap" id="cards"></div>

<script>
// [name, alias, zoo, hall, gender, mother, father, birthday, pedigree, imgFile]
const data = [
  ["萌萌","北二胖, 北动影后","北京动物园","亚运馆","雌性","英英","灵灵","2006/09/13","","mengmeng.png"],
  ["丫丫","","北京动物园","不展出","雌性","乐乐","","2000/08/03","320","yaya.png"],
  ["古古","保安队长, 古大爷","北京动物园","不展出","雄性","盼盼","唐唐","1999/09/25","","gugu.png"],
  ["萌大","","北京动物园","亚运馆","雄性","萌萌","勇勇","2013/08/22","","mengda.png"],
  ["萌二","","北京动物园","亚运馆","雄性","萌萌","勇勇","2013/08/22","","menger.png"],
  ["点点","","北京动物园","亚运馆","雌性","瑛华","","2015/06/20","","dandan.png"],
  ["萌兰","么么, 西直门三太子","北京动物园","奥运馆","雄性","萌萌","美兰","2015/07/04","","menglan.png"],
  ["福星","胖大海","北京动物园","奥运馆","雄性","瑛华","芦芦","2017/06/25","","fuxing.png"],
  ["萌宝","","北京动物园","奥运馆","雌性","萌萌","美兰","2018/05/23","","mengbao.png"],
  ["萌玉","","北京动物园","奥运馆","雌性","萌萌","美兰","2018/05/23","","mengyu.png"],
  ["白天","","北京动物园","亚运馆","雌性","小白兔","芦芦","2018/08/20","","baitian.png"],
  ["喜乐","八里台二公主","天津动物园","","雌性","","","2013/07/24","",""],
  ["格格","八里台大公主","天津动物园","","雌性","","","2003/09/06","",""],
  ["妙音","","大连动物园","","雌性","格格","","2010/08/09","",""],
  ["小馨","","","","雌性","","","","",""],
  ["高高","","","","雄性","","","","",""],
  ["金虎","","大连动物园","","雄性","","","","",""],
  ["飞云","","大连动物园","","雄性","","","","",""],
  ["庆庆","","重庆动物园","","雌性","","","","",""],
  ["重重","","重庆动物园","","雄性","","","","",""],
  ["双双","","重庆动物园","","雄性","","","","",""],
  ["喜喜","","重庆动物园","","雌性","","","","",""],
  ["莽仔","","重庆动物园","","雌性","","","","",""],
  ["莽星星","","重庆动物园","","","莽仔","","","",""],
  ["莽辰辰","","重庆动物园","","","莽仔","","","",""],
  ["莽灿灿","","重庆动物园","","","莽仔","","","",""],
  ["兰香","","重庆动物园","","","","","","",""],
  ["二顺","","重庆动物园","","","","","","",""],
  ["渝可","","重庆动物园","","","","","","",""],
  ["渝爱","","重庆动物园","","","","","","",""],
  ["良月","","重庆动物园","","","","","","",""],
];

const tbody = document.getElementById('tbody');
const cardsEl = document.getElementById('cards');
const totalEl = document.getElementById('total');
const total2El = document.getElementById('total2');
const shownEl = document.getElementById('shown');

totalEl.textContent = data.length;
total2El.textContent = data.length;

function avatarImg(name, imgFile, cls) {
  if (imgFile) return `<img class="${cls}" src="images/pandas/${imgFile}" alt="${name}" onerror="this.outerHTML='<div class=\\'card-avatar-ph\\'>🐼</div>'">`;
  return `<div class="card-avatar-ph">🐼</div>`;
}

function render(rows) {
  // Table
  tbody.innerHTML = rows.map((r, i) => {
    const gc = r[4] === '雌性' ? 'female' : r[4] === '雄性' ? 'male' : '';
    const avImg = r[9] ? `<img class="avatar" src="images/pandas/${r[9]}" alt="${r[0]}" onerror="this.outerHTML='<div class=\\'avatar-placeholder\\'>🐼</div>'">` : `<div class="avatar-placeholder">🐼</div>`;
    return `<tr>
      <td>${i+1}</td><td>${avImg}</td>
      <td><strong>${r[0]}</strong></td>
      <td class="alias">${r[1]}</td>
      <td>${r[2]}</td><td>${r[3]}</td>
      <td class="${gc}">${r[4]}</td>
      <td>${r[5]}</td><td>${r[6]}</td>
      <td>${r[7]}</td><td>${r[8]}</td>
    </tr>`;
  }).join('');

  // Cards
  cardsEl.innerHTML = rows.map((r, i) => {
    const gc = r[4] === '雌性' ? 'tag-female' : r[4] === '雄性' ? 'tag-male' : '';
    const av = r[9] ? `<img src="images/pandas/${r[9]}" alt="${r[0]}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0;" onerror="this.outerHTML='<div class=\\'card-avatar-ph\\'>🐼</div>'">` : `<div class="card-avatar-ph">🐼</div>`;
    const parts = [];
    if (r[2]) parts.push(`📍 ${r[2]}${r[3] ? ' · '+r[3] : ''}`);
    if (r[4]) parts.push(`<span class="${gc}">${r[4]}</span>`);
    if (r[7]) parts.push(`🎂 ${r[7]}`);
    if (r[5]) parts.push(`母: ${r[5]}`);
    if (r[6]) parts.push(`父: ${r[6]}`);
    if (r[8]) parts.push(`谱系: ${r[8]}`);
    return `<div class="panda-card">
      ${av}
      <div class="card-info">
        <div class="card-name">${r[0]}</div>
        ${r[1] ? `<div class="card-alias">${r[1]}</div>` : ''}
        <div class="card-meta">${parts.map(p=>`<span>${p}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');

  shownEl.textContent = rows.length;
}

render(data);

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { render(data); return; }
  const filtered = data.filter(r => r.some(cell => cell.toLowerCase().includes(q)));
  render(filtered);
});
</script>
</body>
</html>
