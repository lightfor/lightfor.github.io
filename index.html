<title>Lightfor</title>
<style>

  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f0eb; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem 1rem; }

  .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .card .icon { font-size: 2.2rem; }
  .card .label { font-size: 1rem; font-weight: 600; }

</style>
