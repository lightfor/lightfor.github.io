<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛事 — Lightfor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
<style>
  body { padding: 1.5rem 1rem; max-width: 900px; margin: 0 auto; }

  .page-header { margin-bottom: 1.5rem; }
  h1 { margin-bottom: 0.25rem; }
  .subtitle { color: #888; font-size: 0.9rem; }

  .event-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .tab-btn {
    padding: 0.45rem 1rem; border-radius: 20px; border: 2px solid #d0c4b8;
    background: #fff; color: #4a3728; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { background: #4a3728; color: #fff; border-color: #4a3728; }
  .tab-btn:hover:not(.active) { border-color: #4a3728; }

  .event-panel { display: none; }
  .event-panel.active { display: block; }
  #panels { position: relative; }

  .event-hero {
    background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 60%, #c0392b 100%);
    border-radius: 16px; padding: 1.5rem; color: #fff; margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
  }
  .event-emblem { font-size: 3.5rem; line-height: 1; }
  .event-info h2 { font-size: clamp(1.2rem, 4vw, 1.6rem); margin-bottom: 0.25rem; }
  .event-info .meta { font-size: 0.85rem; opacity: 0.85; display: flex; gap: 1rem; flex-wrap: wrap; }
  .meta-chip { background: rgba(255,255,255,0.2); border-radius: 10px; padding: 0.2rem 0.6rem; }

  .section-title {
    font-size: 1rem; font-weight: 700; color: #4a3728;
    border-left: 4px solid #2d6a9f; padding-left: 0.6rem;
    margin: 1.5rem 0 0.8rem;
  }

  .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 1.2rem; }
  .group-card { background: #fff; border-radius: 12px; padding: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .group-card h3 { font-size: 1rem; color: #888; margin-bottom: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .team-flag { display: flex; align-items: center; }
  .team-flag img { border-radius: 2px; vertical-align: middle; }

  .ring-wrap { display: flex; flex-direction: column; align-items: center; position: relative; }
  .ring-svg { width: 100%; max-width: 460px; height: auto; }
  .ring-node-flag { border-radius: 3px; }
  .ring-node-label { font-size: 17px; font-weight: 700; fill: #4a3728; }
  .ring-node-pts { font-size: 13px; fill: #2d6a9f; font-weight: 700; }
  .ring-edge-label {
    font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: middle;
  }
  .ring-edge-bg { fill: #2d6a9f; cursor: pointer; }
  .ring-edge-bg.draw { fill: #b0a89c; }
  .ring-edge-line { stroke: #2d6a9f; cursor: pointer; }
  .ring-edge-line.draw { stroke: #b0a89c; }
  .ring-divider { stroke: #e0d8ce; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .ring-zone-label { font-size: 11px; fill: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
  .ring-tooltip {
    position: fixed; background: #4a3728; color: #fff; font-size: 0.85rem;
    padding: 0.4rem 0.7rem; border-radius: 6px; pointer-events: none; white-space: nowrap;
    transform: translate(-50%, -120%); z-index: 50;
  }

  .legend-bar { display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; font-size: 0.85rem; color: #888; margin-bottom: 1rem; }
  .legend-bar span { display: flex; align-items: center; gap: 0.35rem; }
  .legend-bar i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  @media (max-width: 480px) {
    .event-emblem { font-size: 2.5rem; }
    .ring-svg { max-width: 400px; }
  }
</style>
</head>
<body>

<div class="page-header">
  <a class="back-link" href="index.html">← 返回</a>
  <h1>赛事</h1>
  <p class="subtitle">国际赛事 · 球队 · 赛程</p>
</div>

<div class="event-tabs" id="tabs"></div>
<div class="legend-bar">
  <span><i style="background:#27ae60"></i>圆环绿色 = 出线区前两名</span>
  <span>箭头指向 = 战胜对方（鼠标悬停/点击连线查看时间场地）</span>
  <span><i style="background:#b0a89c"></i>平局（无箭头实线）</span>
</div>
<div id="panels"></div>
<div id="tooltip" class="ring-tooltip" style="display:none"></div>

<script>
function flagImg(code) {
  if (!code) return '';
  return `<img src="https://flagcdn.com/20x15/${code}.png" srcset="https://flagcdn.com/40x30/${code}.png 2x" width="20" height="15" alt="${code.toUpperCase()}" style="border-radius:2px;vertical-align:middle">`;
}

function computeGroupStats(g, schedule) {
  const stats = {};
  for (const t of g.teams) stats[t.name] = { team: t, played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
  const stageTag = `${g.group} 组`;
  const matches = (schedule || []).filter(m => m.stage === stageTag);
  const h2h = {};
  for (const m of matches) {
    if (!m.score) continue;
    const [hs, as] = m.score.split(':').map(Number);
    const home = stats[m.home.name], away = stats[m.away.name];
    if (!home || !away) continue;
    home.played++; away.played++;
    home.gf += hs; home.ga += as;
    away.gf += as; away.ga += hs;
    if (hs > as) { home.w++; home.pts += 3; away.l++; }
    else if (hs < as) { away.w++; away.pts += 3; home.l++; }
    else { home.d++; away.d++; home.pts++; away.pts++; }
    h2h[`${m.home.name}|${m.away.name}`] = { score: m.score, time: m.time, venue: m.venue };
    h2h[`${m.away.name}|${m.home.name}`] = { score: `${as}:${hs}`, time: m.time, venue: m.venue };
  }
  const ranked = Object.values(stats).sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
  return { ranked, h2h };
}

function renderStandings(g, schedule) {
  const { ranked, h2h } = computeGroupStats(g, schedule);
  const n = ranked.length;
  const w = 420, h = 480;
  // top row = qualifying spots (rank 1-2), bottom row = eliminated (rank 3-4)
  const slots = [
    { x: w * 0.27, y: h * 0.27 }, { x: w * 0.73, y: h * 0.27 },
    { x: w * 0.27, y: h * 0.73 }, { x: w * 0.73, y: h * 0.73 }
  ];
  const pos = slots.slice(0, n);
  // pair order (i<j): 0-1 top edge, 0-2 left edge, 0-3 diagonal\, 1-2 diagonal/, 1-3 right edge, 2-3 bottom edge
  // straight edges get a small perpendicular nudge; diagonals bow outward (away from each other) so they
  // don't overlap visually and each keeps its own score badge on its own curve
  const edgeStyle = [
    { shift: [0, -24], bow: 0 },   // 0-1
    { shift: [-50, 0], bow: 0 },   // 0-2
    { shift: [0, 0], bow: -45 },   // 0-3 (\ diagonal) bows toward top-right
    { shift: [0, 0], bow: 45 },    // 1-2 (/ diagonal) bows toward bottom-right
    { shift: [50, 0], bow: 0 },    // 1-3
    { shift: [0, 24], bow: 0 }     // 2-3
  ];

  let edges = '';
  let pairIdx = 0;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = ranked[i], b = ranked[j];
      const info = h2h[`${a.team.name}|${b.team.name}`];
      if (!info) { pairIdx++; continue; }
      const [as, bs] = info.score.split(':').map(Number);
      const isDraw = as === bs;
      const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const pad = 33;
      const x1 = pos[i].x + (dx / dist) * pad, y1 = pos[i].y + (dy / dist) * pad;
      const x2 = pos[j].x - (dx / dist) * pad, y2 = pos[j].y - (dy / dist) * pad;
      const { shift: [shiftX, shiftY], bow } = edgeStyle[pairIdx] || { shift: [0, 0], bow: 0 };
      // perpendicular unit vector, used to bow diagonal curves away from the canvas center
      const nx = -dy / dist, ny = dx / dist;
      const cx1 = (x1 + x2) / 2 + nx * bow, cy1 = (y1 + y2) / 2 + ny * bow;
      const mx = (x1 + x2) / 2 + shiftX + nx * bow, my = (y1 + y2) / 2 + shiftY + ny * bow;
      const tip = `${info.time} · ${info.venue}`.replace(/"/g, '&quot;');
      const pathD = bow ? `M${x1},${y1} Q${cx1},${cy1} ${x2},${y2}` : null;
      const pathDRev = bow ? `M${x2},${y2} Q${cx1},${cy1} ${x1},${y1}` : null;
      if (isDraw) {
        edges += pathD
          ? `<path class="ring-edge-line draw" data-tip="${tip}" d="${pathD}" fill="none" stroke-width="3"/>`
          : `<line class="ring-edge-line draw" data-tip="${tip}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="3"/>`;
      } else if (as > bs) {
        edges += pathD
          ? `<path class="ring-edge-line" data-tip="${tip}" d="${pathD}" fill="none" stroke-width="3" marker-end="url(#arrow)"/>`
          : `<line class="ring-edge-line" data-tip="${tip}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="3" marker-end="url(#arrow)"/>`;
      } else {
        edges += pathD
          ? `<path class="ring-edge-line" data-tip="${tip}" d="${pathDRev}" fill="none" stroke-width="3" marker-end="url(#arrow)"/>`
          : `<line class="ring-edge-line" data-tip="${tip}" x1="${x2}" y1="${y2}" x2="${x1}" y2="${y1}" stroke-width="3" marker-end="url(#arrow)"/>`;
      }
      const displayScore = as >= bs ? info.score : `${bs}:${as}`;
      edges += `<rect class="ring-edge-bg ${isDraw ? 'draw' : ''}" data-tip="${tip}" x="${mx - 22}" y="${my - 13}" width="44" height="26" rx="6"/>`;
      edges += `<text class="ring-edge-label" x="${mx}" y="${my + 1}">${displayScore}</text>`;
      pairIdx++;
    }
  }

  let nodes = '';
  ranked.forEach((s, i) => {
    const p = pos[i];
    const labelAbove = p.y < h / 2;
    const gd = s.gf - s.ga;
    const lineY = labelAbove ? [p.y - 66, p.y - 48, p.y - 30] : [p.y + 44, p.y + 62, p.y + 80];
    nodes += `
      <g>
        <circle cx="${p.x}" cy="${p.y}" r="24" fill="#fff" stroke="${i < 2 ? '#27ae60' : '#d0c4b8'}" stroke-width="3"/>
        ${s.team.flag ? `<image class="ring-node-flag" href="https://flagcdn.com/40x30/${s.team.flag}.png" x="${p.x - 17}" y="${p.y - 12}" width="34" height="24"/>` : ''}
        <text class="ring-node-label" x="${p.x}" y="${lineY[0]}" text-anchor="middle">${i + 1}. ${s.team.name}</text>
        <text class="ring-node-pts" x="${p.x}" y="${lineY[1]}" text-anchor="middle">${s.w}胜${s.d}平${s.l}负 ${s.pts}分</text>
        <text class="ring-node-pts" x="${p.x}" y="${lineY[2]}" text-anchor="middle">净胜球 ${gd > 0 ? '+' : ''}${gd}</text>
      </g>`;
  });

  const dividerY = h / 2;
  return `
  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 ${w} ${h + 60}">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#2d6a9f"/>
        </marker>
      </defs>
      <g transform="translate(0, 22)">
        <text class="ring-zone-label" x="10" y="-6" text-anchor="start">↑ 出线区</text>
        <line class="ring-divider" x1="0" y1="${dividerY}" x2="${w}" y2="${dividerY}"/>
        <text class="ring-zone-label" x="10" y="${h + 14}" text-anchor="start">↓ 淘汰区</text>
        ${edges}${nodes}
      </g>
    </svg>
  </div>`;
}

function renderCompetition(c) {
  // hero
  let html = `
  <div class="event-hero">
    <div class="event-emblem">${c.emblem}</div>
    <div class="event-info">
      <h2>${c.name}</h2>
      <div class="meta">
        <span class="meta-chip">📅 ${c.dates}</span>
        <span class="meta-chip">🌎 ${c.host}</span>
        <span class="meta-chip">${c.teams_count}支球队</span>
        <span class="meta-chip">${c.matches_count}场比赛</span>
      </div>
    </div>
  </div>`;

  // groups
  if (c.groups && c.groups.length) {
    html += `<div class="section-title">小组赛分组（${c.groups.length}组 · ${c.teams_count}队）</div><div class="groups-grid">`;
    for (const g of c.groups) {
      html += `<div class="group-card"><h3>${g.group} 组</h3>${renderStandings(g, c.schedule)}</div>`;
    }
    html += `</div>`;
  }

  return html;
}

fetch('data/competitions.json')
  .then(r => r.json())
  .then(data => {
    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');
    data.competitions.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.textContent = `${c.emblem} ${c.name}`;
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.event-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + c.id).classList.add('active');
      };
      tabs.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'event-panel' + (i === 0 ? ' active' : '');
      panel.id = 'panel-' + c.id;
      panel.innerHTML = renderCompetition(c);
      panels.appendChild(panel);
    });

    const tooltip = document.getElementById('tooltip');
    const showTip = (el, evt) => {
      const tip = el.getAttribute('data-tip');
      if (!tip) return;
      tooltip.textContent = tip;
      tooltip.style.display = 'block';
      tooltip.style.left = evt.clientX + 'px';
      tooltip.style.top = evt.clientY + 'px';
    };
    panels.addEventListener('mousemove', (evt) => {
      const el = evt.target.closest('[data-tip]');
      if (el) showTip(el, evt); else tooltip.style.display = 'none';
    });
    panels.addEventListener('mouseleave', () => tooltip.style.display = 'none');
    panels.addEventListener('click', (evt) => {
      const el = evt.target.closest('[data-tip]');
      if (el) showTip(el, evt);
    });
  });
</script>

</body>
</html>
