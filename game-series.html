<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏系列</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="rankings.css">
    <style>
        /* ── Level 1: Company ── */
        .company-list { display: flex; flex-direction: column; gap: 24px; }
        .company-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .company-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white; padding: 18px 24px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none;
        }
        .company-header-left { display: flex; align-items: center; gap: 14px; }
        .company-logo { font-size: 2rem; line-height: 1; }
        .company-name { font-size: 1.3rem; font-weight: 800; margin: 0 0 4px; }
        .company-info { font-size: 0.8rem; opacity: 0.75; display: flex; gap: 12px; flex-wrap: wrap; }
        .company-badge { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 14px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
        .company-toggle { font-size: 1.1rem; transition: transform 0.25s; flex-shrink: 0; }
        .company-toggle.open { transform: rotate(180deg); }
        .company-body { display: none; }
        .company-body.open { display: block; }

        /* ── Level 2: Series ── */
        .series-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
        .series-item { border: 1.5px solid #e8eaf6; border-radius: 12px; overflow: hidden; }
        .series-header {
            background: linear-gradient(135deg, #f8f9ff 0%, #eef0ff 100%);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none;
        }
        .series-header:hover { background: linear-gradient(135deg, #eef0ff 0%, #e0e4ff 100%); }
        .series-name { font-size: 1rem; font-weight: 700; color: #3949ab; margin: 0; }
        .series-sub { font-size: 0.78rem; color: #7986cb; margin-top: 3px; }
        .series-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .series-count { background: #e8eaf6; color: #3949ab; padding: 2px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; }
        .series-toggle { font-size: 0.85rem; color: #9fa8da; transition: transform 0.25s; }
        .series-toggle.open { transform: rotate(180deg); }
        .series-body { display: none; }
        .series-body.open { display: block; }

        /* ── Level 3: Games (rich rows) ── */
        .game-row {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 16px; border-top: 1px solid #f0f0f0; transition: background 0.15s;
        }
        .game-row:hover { background: #f8f9ff; }
        .game-row.not-played { opacity: 0.55; }
        .game-poster {
            width: 48px; height: 64px; object-fit: cover;
            border-radius: 6px; flex-shrink: 0; display: block; background: #e8eaf6;
        }
        .game-poster-placeholder { width: 48px; height: 64px; border-radius: 6px; flex-shrink: 0; background: #e8eaf6; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #aaa; }
        .game-info { flex: 1; min-width: 0; }
        .game-title { font-size: 0.88rem; font-weight: 600; color: #333; margin-bottom: 4px; word-break: break-word; }
        .game-title a { color: #667eea; text-decoration: none; }
        .game-title a:hover { text-decoration: underline; }
        .game-meta { font-size: 0.75rem; color: #888; display: flex; flex-wrap: wrap; gap: 6px; }
        .game-platform-badge { background: #f3f4f6; padding: 1px 7px; border-radius: 7px; }
        .game-comment { font-size: 0.78rem; color: #666; margin-top: 4px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .game-num { width: 22px; height: 22px; border-radius: 50%; background: #e8eaf6; color: #5c6bc0; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 20px; }

        /* ── Filters ── */
        .page-filters {
            background: white; padding: 16px 20px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        .page-filters input { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; flex: 1; min-width: 200px; }
        .page-filters input:focus { outline: none; border-color: #3949ab; }

        @media (max-width: 680px) {
            .game-poster, .game-poster-placeholder { width: 40px; height: 54px; }
            .game-num { display: none; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <span class="nav-title">📚 游戏系列</span>
        <a class="nav-tab active" href="game-series.html" style="text-decoration:none;">📚 游戏系列</a>
        <a class="nav-tab" href="rankings.html" style="text-decoration:none;">📊 游戏 &amp; 影视数据中心</a>
        <a class="nav-tab" href="index.html" style="text-decoration:none;">🏠 主页</a>
    </nav>

    <div class="container">
        <div class="header">
            <h1>游戏系列</h1>
            <p>顶级游戏公司 · 旗下系列 · 系列游戏</p>
        </div>

        <div class="page-filters">
            <input type="text" id="search" placeholder="搜索公司、系列或游戏名称..." oninput="page.filter()">
        </div>

        <div class="stats">
            <div class="stat-item"><div class="stat-value" id="stat-companies">0</div><div class="stat-label">公司数</div></div>
            <div class="stat-item"><div class="stat-value" id="stat-series">0</div><div class="stat-label">系列数</div></div>
            <div class="stat-item"><div class="stat-value" id="stat-games">0</div><div class="stat-label">游戏总数</div></div>
        </div>

        <div class="company-list" id="company-list"></div>
    </div>

    <script>
    function esc(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const page = (() => {
        let allSeries = [], ready = false;

        function load() {
            fetch('data/rankings/game-series.json')
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                .then(data => { allSeries = data; ready = true; filter(); })
                .catch(err => {
                    document.getElementById('company-list').innerHTML =
                        `<p style="color:#999;padding:40px;text-align:center;">加载失败：${err.message}</p>`;
                });
        }

        // Group series by company, return array of company objects
        function groupByCompany(seriesList) {
            const map = new Map();
            seriesList.forEach(s => {
                const co = s.company || { name: '其他', country: '', founded: '', logo: '📦' };
                if (!map.has(co.name)) map.set(co.name, { ...co, seriesList: [] });
                map.get(co.name).seriesList.push(s);
            });
            return Array.from(map.values());
        }

        function filter() {
            if (!ready) return;
            const q = (document.getElementById('search')?.value || '').toLowerCase();

            let filtered = allSeries;
            if (q) {
                filtered = allSeries.map(s => {
                    const coName = (s.company?.name || '').toLowerCase();
                    if (coName.includes(q) || s.series.toLowerCase().includes(q)) return s;
                    const mg = s.games.filter(g => g.title.toLowerCase().includes(q));
                    if (mg.length) return { ...s, games: mg };
                    return null;
                }).filter(Boolean);
            }

            const grouped = groupByCompany(filtered);
            const totalGames = filtered.reduce((n, s) => n + s.games.length, 0);
            document.getElementById('stat-companies').textContent = grouped.length;
            document.getElementById('stat-series').textContent = filtered.length;
            document.getElementById('stat-games').textContent = totalGames;

            _srIdx = 0;
            const list = document.getElementById('company-list');
            list.innerHTML = grouped.length
                ? grouped.map(renderCo).join('')
                : '<p style="color:#999;padding:40px;text-align:center;">没有找到匹配结果</p>';
        }

        /* ── L1: Company ── */
        function renderCo(c) {
            const id = 'co-' + c.name.replace(/[^a-zA-Z0-9]/g, '_');
            const totalGames = c.seriesList.reduce((n, s) => n + s.games.length, 0);
            return `<div class="company-card">
                <div class="company-header" onclick="page.toggleCo('${id}')">
                    <div class="company-header-left">
                        <span class="company-logo">${esc(c.logo)}</span>
                        <div>
                            <div class="company-name">${esc(c.name)}</div>
                            <div class="company-info">
                                ${c.country ? `<span>${esc(c.country)}</span>` : ''}
                                ${c.founded ? `<span>成立 ${c.founded}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span class="company-badge">${c.seriesList.length} 系列 · ${totalGames} 游戏</span>
                        <span class="company-toggle open" id="${id}-icon">▼</span>
                    </div>
                </div>
                <div class="company-body open" id="${id}-body">
                    <div class="series-list">${c.seriesList.map(s => renderSr(id, s)).join('')}</div>
                </div>
            </div>`;
        }

        /* ── L2: Series ── */
        let _srIdx = 0;
        function renderSr(coId, s) {
            const id = coId + '_sr' + (_srIdx++);
            const genre = (s.games[0]?.genre || []).join(' / ') || '—';
            return `<div class="series-item">
                <div class="series-header" onclick="page.toggleSr('${id}')">
                    <div>
                        <div class="series-name">${esc(s.series)}</div>
                        <div class="series-sub">${esc(genre)}</div>
                    </div>
                    <div class="series-right">
                        <span class="series-count">${s.games.length} 作</span>
                        <span class="series-toggle" id="${id}-icon">▼</span>
                    </div>
                </div>
                <div class="series-body" id="${id}-body">
                    ${s.games.map((g, i) => renderGame(g, i + 1)).join('')}
                </div>
            </div>`;
        }

        /* ── L3: Game row ── */
        function renderGame(g, num) {
            const poster = g.posterUrl
                ? `<img class="game-poster" src="${esc(g.posterUrl)}" loading="lazy" onerror="this.outerHTML='<div class=\\'game-poster-placeholder\\'>🎮</div>'">`
                : `<div class="game-poster-placeholder">🎮</div>`;
            const titleHtml = g.detailLink
                ? `<a href="${esc(g.detailLink)}" target="_blank">${esc(g.title)}</a>`
                : esc(g.title);
            const year = g.year ? `<span>${g.year}</span>` : '';
            const platforms = (g.platforms || []).slice(0, 4).map(p => `<span class="game-platform-badge">${esc(p)}</span>`).join('');
            const comment = g.comment ? `<div class="game-comment">${esc(g.comment)}</div>` : '';
            return `<div class="game-row">
                <span class="game-num">${num}</span>
                ${poster}
                <div class="game-info">
                    <div class="game-title">${titleHtml}</div>
                    <div class="game-meta">${year}${platforms}</div>
                    ${comment}
                </div>
            </div>`;
        }

        function toggleCo(id) {
            const b = document.getElementById(id + '-body'), ic = document.getElementById(id + '-icon');
            if (!b) return;
            const open = b.classList.toggle('open');
            if (ic) ic.classList.toggle('open', open);
        }

        function toggleSr(id) {
            const b = document.getElementById(id + '-body'), ic = document.getElementById(id + '-icon');
            if (!b) return;
            const open = b.classList.toggle('open');
            if (ic) ic.classList.toggle('open', open);
        }

        return { load, filter, toggleCo, toggleSr };
    })();

    page.load();
    </script>
</body>
</html>
