<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经济数据 - LPR走势</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
<style>
  body { padding: 1.2rem 1rem 3rem; max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 1rem; }
  header h1 { margin-bottom: 0.3rem; }
  header p { color: #888; font-size: 0.85rem; }

  .module-nav { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 1.4rem; }
  .module-nav button {
    border: 1px solid #d8cfc4; background: #fff; color: #4a3728;
    border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 0.85rem;
    cursor: pointer; min-height: 44px;
  }
  .module-nav button.active { background: #4a3728; color: #fff; border-color: #4a3728; }

  .chart-card {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 1rem; margin-bottom: 1.2rem;
  }
  .chart-card h2 { font-size: 1.05rem; color: #4a3728; margin-bottom: 0.2rem; }
  .chart-card .sub { font-size: 0.78rem; color: #999; margin-bottom: 0.8rem; }

  .legend { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.6rem; font-size: 0.78rem; }
  .legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .chart-wrap { position: relative; width: 100%; overflow-x: auto; }
  canvas { display: block; width: 100%; height: 360px; touch-action: pan-y; }

  .tooltip {
    position: absolute; pointer-events: none; background: #4a3728; color: #fff;
    font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; transform: translate(-50%, -110%);
    white-space: nowrap; opacity: 0; transition: opacity 0.1s;
  }

  .source-note { font-size: 0.78rem; color: #999; margin-top: 0.4rem; line-height: 1.5; }
  .source-note a { color: #4a3728; }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 返回首页</a>
<header>
  <h1>📈 经济数据</h1>
  <p>记录各类宏观经济数据走势</p>
</header>

<div class="module-nav" id="moduleNav"></div>

<div id="moduleContainer"></div>

<script>
const TODAY = "2026-06-28";
const DATA_FILES = {
  lpr: "data/economic/econ-lpr.json",
  rrr: "data/economic/econ-rrr.json",
  cpippi: "data/economic/econ-cpi-ppi.json",
  gdp: "data/economic/econ-gdp.json",
  m2: "data/economic/econ-m2-sf.json",
  fx: "data/economic/econ-fx-reserves.json",
};

const container = document.getElementById('moduleContainer');
const nav = document.getElementById('moduleNav');
const moduleKeys = Object.keys(DATA_FILES);

function parseDate(d) { return new Date(d + "T00:00:00Z").getTime(); }

function toStepSeries(points, endDate) {
  const out = [];
  points.forEach((p, i) => {
    out.push(p);
    const next = points[i + 1] ? points[i + 1].date : endDate;
    out.push({ date: next, rate: p.rate, _flat: true });
  });
  return out;
}

function buildModule(key, m) {
  const section = document.createElement('section');
  section.id = 'module-' + key;
  section.style.display = 'none';

  const legendHtml = m.series.map(s =>
    `<span><i style="background:${s.color}"></i>${s.name}</span>`
  ).join('');

  section.innerHTML = `
    <div class="chart-card">
      <h2>${m.title}</h2>
      <div class="sub">${m.sub}</div>
      <div class="legend">${legendHtml}</div>
      <div class="chart-wrap">
        <canvas></canvas>
        <div class="tooltip"></div>
      </div>
    </div>
    <p class="source-note">数据来源：<a href="${m.source.url}" target="_blank" rel="noopener">${m.source.name}</a></p>
  `;
  container.appendChild(section);

  const canvas = section.querySelector('canvas');
  const wrap = section.querySelector('.chart-wrap');
  const tooltip = section.querySelector('.tooltip');
  const ctx = canvas.getContext('2d');

  const seriesData = m.series.map(s => ({
    ...s,
    plot: m.type === 'line-step' ? toStepSeries(s.points, TODAY) : s.points
  }));

  const allDates = seriesData.flatMap(s => s.plot.map(p => parseDate(p.date)));
  const minT = Math.min(...allDates);
  const maxT = parseDate(TODAY);

  function x(t, padL, w) { return padL + (t - minT) / (maxT - minT) * w; }
  function y(r, padT, h) { return padT + h - (r - m.yMin) / (m.yMax - m.yMin) * h; }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = wrap.clientWidth;
    const cssH = 360;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    const padL = 46, padR = 8, padT = 16, padB = 26;
    const w = cssW - padL - padR;
    const h = cssH - padT - padB;

    ctx.strokeStyle = "#eee";
    ctx.fillStyle = "#999";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const steps = 5;
    for (let i = 0; i <= steps; i++) {
      const r = m.yMin + (m.yMax - m.yMin) * i / steps;
      const yy = y(r, padT, h);
      ctx.beginPath();
      ctx.moveTo(padL, yy);
      ctx.lineTo(padL + w, yy);
      ctx.stroke();
      ctx.fillText((Math.round(r * 100) / 100) + (m.unit === '%' ? '%' : ''), padL - 6, yy);
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const startYear = new Date(minT).getUTCFullYear();
    const endYear = new Date(maxT).getUTCFullYear();
    const yearSpan = endYear - startYear;
    const yearStep = yearSpan > 12 ? 4 : (yearSpan > 4 ? 1 : 1);
    for (let year = startYear; year <= endYear; year += yearStep) {
      const t = parseDate(year + "-01-01");
      if (t < minT || t > maxT) continue;
      ctx.fillText(year, x(t, padL, w), padT + h + 6);
    }

    seriesData.forEach(s => {
      ctx.beginPath();
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2;
      s.plot.forEach((p, i) => {
        const xx = x(parseDate(p.date), padL, w);
        const yy = y(p.rate, padT, h);
        if (i === 0) ctx.moveTo(xx, yy);
        else ctx.lineTo(xx, yy);
      });
      ctx.stroke();
      if (m.type === 'line-point') {
        ctx.fillStyle = s.color;
        s.plot.forEach(p => {
          const xx = x(parseDate(p.date), padL, w);
          const yy = y(p.rate, padT, h);
          ctx.beginPath();
          ctx.arc(xx, yy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    });

    canvas._plot = { padL, w, padT, h };
  }

  function findNearest(points, t) {
    let best = points[0], bestDiff = Infinity;
    points.forEach(p => {
      const diff = Math.abs(parseDate(p.date) - t);
      if (diff < bestDiff) { bestDiff = diff; best = p; }
    });
    return best;
  }

  function handleMove(clientX) {
    const rect = canvas.getBoundingClientRect();
    const relX = clientX - rect.left;
    const { padL, w } = canvas._plot;
    if (relX < padL || relX > padL + w) { tooltip.style.opacity = 0; return; }
    const t = minT + (relX - padL) / w * (maxT - minT);
    const parts = seriesData.map(s => {
      const p = findNearest(s.points, t);
      return `${s.name} ${p.rate}${m.unit}`;
    });
    const refDate = findNearest(seriesData[0].points, t).date;
    tooltip.style.opacity = 1;
    tooltip.style.left = relX + "px";
    tooltip.style.top = "20px";
    tooltip.textContent = `${refDate}: ${parts.join(' / ')}`;
  }

  canvas.addEventListener('mousemove', e => handleMove(e.clientX));
  canvas.addEventListener('mouseleave', () => tooltip.style.opacity = 0);
  canvas.addEventListener('touchstart', e => handleMove(e.touches[0].clientX), { passive: true });
  canvas.addEventListener('touchmove', e => handleMove(e.touches[0].clientX), { passive: true });

  return { section, draw };
}

const modules = {};

async function init() {
  const entries = await Promise.all(
    moduleKeys.map(key => fetch(DATA_FILES[key]).then(r => r.json()).then(data => [key, data]))
  );

  entries.forEach(([key, m], i) => {
    const btn = document.createElement('button');
    btn.textContent = m.title.split(/[（(]/)[0].trim();
    btn.dataset.module = key;
    if (i === 0) btn.classList.add('active');
    nav.appendChild(btn);

    modules[key] = buildModule(key, m);
    if (i === 0) modules[key].section.style.display = '';
  });

  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      moduleKeys.forEach(k => modules[k].section.style.display = 'none');
      const key = btn.dataset.module;
      modules[key].section.style.display = '';
      modules[key].draw();
    });
  });

  modules[moduleKeys[0]].draw();
  window.addEventListener('resize', () => {
    moduleKeys.forEach(k => {
      if (modules[k].section.style.display !== 'none') modules[k].draw();
    });
  });
}

init();
</script>
</body>
</html>
