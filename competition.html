<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛事 — Lightfor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
<style>
  body { padding: 1.5rem 1rem; max-width: 900px; margin: 0 auto; }

  .page-header { margin-bottom: 1.5rem; }
  h1 { margin-bottom: 0.25rem; }
  .subtitle { color: #888; font-size: 0.9rem; }

  .event-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .tab-btn {
    padding: 0.45rem 1rem; border-radius: 20px; border: 2px solid #d0c4b8;
    background: #fff; color: #4a3728; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { background: #4a3728; color: #fff; border-color: #4a3728; }
  .tab-btn:hover:not(.active) { border-color: #4a3728; }

  .event-panel { display: none; }
  .event-panel.active { display: block; }

  .event-hero {
    background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 60%, #c0392b 100%);
    border-radius: 16px; padding: 1.5rem; color: #fff; margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
  }
  .event-emblem { font-size: 3.5rem; line-height: 1; }
  .event-info h2 { font-size: clamp(1.2rem, 4vw, 1.6rem); margin-bottom: 0.25rem; }
  .event-info .meta { font-size: 0.85rem; opacity: 0.85; display: flex; gap: 1rem; flex-wrap: wrap; }
  .meta-chip { background: rgba(255,255,255,0.2); border-radius: 10px; padding: 0.2rem 0.6rem; }

  .section-title {
    font-size: 1rem; font-weight: 700; color: #4a3728;
    border-left: 4px solid #2d6a9f; padding-left: 0.6rem;
    margin: 1.5rem 0 0.8rem;
  }

  .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .group-card { background: #fff; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .group-card h3 { font-size: 0.85rem; color: #888; margin-bottom: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .team-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; border-bottom: 1px solid #f0ebe5; font-size: 0.88rem; }
  .team-row:last-child { border-bottom: none; }
  .team-flag { display: flex; align-items: center; }
  .team-flag img { border-radius: 2px; vertical-align: middle; }
  .team-name { flex: 1; }

  .schedule-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .match-card {
    background: #fff; border-radius: 10px; padding: 0.8rem 1rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.5rem;
  }
  .match-card.played { border-left: 4px solid #27ae60; }
  .match-card.upcoming { border-left: 4px solid #2d6a9f; }
  .team-side { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 600; }
  .team-side.right { flex-direction: row-reverse; text-align: right; }
  .score-box { text-align: center; min-width: 70px; }
  .score { font-size: 1.2rem; font-weight: 700; color: #333; }
  .match-meta { font-size: 0.72rem; color: #aaa; white-space: nowrap; }
  .stage-label {
    font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase;
    letter-spacing: 0.06em; margin: 1rem 0 0.4rem; padding-left: 0.2rem;
  }

  @media (max-width: 480px) {
    .match-card { padding: 0.7rem; }
    .score { font-size: 1rem; }
    .team-side { font-size: 0.82rem; }
    .event-emblem { font-size: 2.5rem; }
  }
</style>
</head>
<body>

<div class="page-header">
  <a class="back-link" href="index.html">← 返回</a>
  <h1>赛事</h1>
  <p class="subtitle">国际赛事 · 球队 · 赛程</p>
</div>

<div class="event-tabs" id="tabs"></div>
<div id="panels"></div>

<script>
function flagImg(code) {
  if (!code) return '';
  return `<img src="https://flagcdn.com/20x15/${code}.png" srcset="https://flagcdn.com/40x30/${code}.png 2x" width="20" height="15" alt="${code.toUpperCase()}" style="border-radius:2px;vertical-align:middle">`;
}

function renderCompetition(c) {
  // hero
  let html = `
  <div class="event-hero">
    <div class="event-emblem">${c.emblem}</div>
    <div class="event-info">
      <h2>${c.name}</h2>
      <div class="meta">
        <span class="meta-chip">📅 ${c.dates}</span>
        <span class="meta-chip">🌎 ${c.host}</span>
        <span class="meta-chip">${c.teams_count}支球队</span>
        <span class="meta-chip">${c.matches_count}场比赛</span>
      </div>
    </div>
  </div>`;

  // groups
  if (c.groups && c.groups.length) {
    html += `<div class="section-title">小组赛分组（${c.groups.length}组 · ${c.teams_count}队）</div><div class="groups-grid">`;
    for (const g of c.groups) {
      html += `<div class="group-card"><h3>${g.group} 组</h3>`;
      for (const t of g.teams) {
        html += `<div class="team-row"><span class="team-flag">${flagImg(t.flag)}</span><span class="team-name">${t.name}</span></div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  // schedule
  if (c.schedule && c.schedule.length) {
    html += `<div class="section-title">赛程（上海时间 GMT+8）</div><div class="schedule-list">`;
    let lastStage = null;
    for (const m of c.schedule) {
      if (m.stage !== lastStage) {
        html += `<div class="stage-label">${m.stage}</div>`;
        lastStage = m.stage;
      }
      const scoreDisplay = m.score ? m.score : 'vs';
      const cls = m.score ? 'played' : 'upcoming';
      html += `
      <div class="match-card ${cls}">
        <div class="team-side"><span class="team-flag">${flagImg(m.home.flag)}</span><span>${m.home.name}</span></div>
        <div class="score-box">
          <div class="score">${scoreDisplay}</div>
          <div class="match-meta">${m.time}</div>
          <div class="match-meta">${m.venue}</div>
        </div>
        <div class="team-side right"><span class="team-flag">${flagImg(m.away.flag)}</span><span>${m.away.name}</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  return html;
}

fetch('data/competitions.json')
  .then(r => r.json())
  .then(data => {
    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');
    data.competitions.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.textContent = `${c.emblem} ${c.name}`;
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.event-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + c.id).classList.add('active');
      };
      tabs.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'event-panel' + (i === 0 ? ' active' : '');
      panel.id = 'panel-' + c.id;
      panel.innerHTML = renderCompetition(c);
      panels.appendChild(panel);
    });
  });
</script>

</body>
</html>
