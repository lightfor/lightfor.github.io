<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品规格对比</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f0eb;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; padding: 30px 0; }

        .header h1 {
            font-size: clamp(1.4rem, 5vw, 2rem);
            color: #4a3728;
        }

        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 12px 28px;
            background: #fff;
            border: 2px solid #e0d5cc;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
            min-height: 44px;
        }

        .category-tab:hover {
            background: #fdf8f5;
            border-color: #c4a882;
            transform: translateY(-1px);
        }

        .category-tab.active {
            background: #4a3728;
            border-color: #4a3728;
            color: #fff;
            box-shadow: 0 4px 14px rgba(74, 55, 40, 0.25);
        }

        .category-tab svg { width: 22px; height: 22px; }

        .selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .selector-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #fdf8f5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            min-height: 44px;
        }

        .selector-item:hover { background: #f5ede4; }

        .selector-item input { width: 18px; height: 18px; cursor: pointer; }
        .selector-item span  { font-weight: 500; }

        .selector-item.checked {
            background: #fdf0e8;
            border-color: #c4a882;
        }

        .selector-item.tablet-item.checked {
            background: #e8f5f4;
            border-color: #5bada6;
        }

        .table-container {
            overflow-x: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #e8e0d8;
        }

        table { width: 100%; border-collapse: collapse; min-width: 600px; }

        th, td {
            padding: 13px 18px;
            text-align: left;
            border-bottom: 1px solid #f0e8e0;
            font-size: 0.9rem;
        }

        th {
            background: #f5ede4;
            color: #4a3728;
            font-weight: 700;
            position: sticky;
            top: 0;
        }

        th:first-child { border-radius: 12px 0 0 0; }
        th:last-child  { border-radius: 0 12px 0 0; }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: #fdf8f5; }

        .spec-category {
            background: #fdf0e8 !important;
            color: #7a5230;
            font-weight: bold;
        }

        .spec-category.tablet-category {
            background: #e8f5f4 !important;
            color: #3d8880;
        }

        .highlight      { color: #b85c2a; font-weight: 600; }
        .highlight-teal { color: #3d8880; font-weight: 600; }

        .price-row td { background: #fffae8; font-weight: bold; }
        .price-row td:last-child { color: #a07830; }

        .tips   { text-align: center; color: #999; margin-top: 14px; font-size: 0.88rem; }
        .footer { text-align: center; padding: 20px; color: #bbb; font-size: 0.82rem; }

        @media (max-width: 680px) {
            .category-tab { padding: 10px 18px; font-size: 0.9rem; }
            th, td { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 产品规格对比</h1>
        </div>

        <div class="category-tabs" id="category-tabs"></div>

        <div class="selector" id="product-selector"></div>

        <div class="table-container">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <p class="tips">💡 切换上方品类标签切换对比类型，同品类产品才能进行规格对比</p>
        <div class="footer"><p>※ 规格信息来自公开资料，实际请以官方为准</p></div>
    </div>

    <script>
    let categories = [];
    let specDefinitions = {};
    let products = {};
    let currentCategory = '';
    const selectedProducts = {};

    async function loadData() {
        const [cats, specs, prods] = await Promise.all([
            fetch('data/product-categories.json').then(r => r.json()),
            fetch('data/product-spec-definitions.json').then(r => r.json()),
            fetch('data/products.json').then(r => r.json())
        ]);
        categories = cats;
        specDefinitions = specs;
        products = prods;
        currentCategory = categories[0].id;
        categories.forEach(cat => {
            selectedProducts[cat.id] = products[cat.id].map(p => p.id);
        });
        renderCategoryTabs();
        renderProductSelector();
        renderTable();
    }

    function renderCategoryTabs() {
        document.getElementById('category-tabs').innerHTML = categories.map(cat => `
            <div class="category-tab ${cat.id === currentCategory ? 'active' : ''}"
                 onclick="switchCategory('${cat.id}')">
                ${cat.icon}
                <span>${cat.name}</span>
            </div>
        `).join('');
    }

    function renderProductSelector() {
        const isTablet = currentCategory === 'tablet';
        document.getElementById('product-selector').innerHTML = products[currentCategory].map(p => `
            <label class="selector-item ${isTablet ? 'tablet-item' : ''} ${selectedProducts[currentCategory].includes(p.id) ? 'checked' : ''}">
                <input type="checkbox"
                       value="${p.id}"
                       ${selectedProducts[currentCategory].includes(p.id) ? 'checked' : ''}
                       onchange="toggleProduct(${p.id})">
                <span>${p.name}</span>
            </label>
        `).join('');
    }

    function renderTable() {
        const selected = products[currentCategory].filter(p => selectedProducts[currentCategory].includes(p.id));
        const specDefs = specDefinitions[currentCategory];
        const isTablet = currentCategory === 'tablet';
        const colW = Math.floor(100 / (selected.length + 1));

        document.getElementById('table-head').innerHTML = `
            <tr>
                <th style="width:20%;">规格项目</th>
                ${selected.map(p => `<th style="width:${colW}%;">${p.name}</th>`).join('')}
            </tr>`;

        let html = '';
        specDefs.forEach(group => {
            html += `<tr><td colspan="${selected.length + 1}" class="spec-category ${isTablet ? 'tablet-category' : ''}">${group.category}</td></tr>`;
            group.specs.forEach(spec => {
                html += '<tr><td>' + spec.label + '</td>';
                selected.forEach(prod => {
                    const sv = prod.specs[spec.key];
                    const val = sv ? sv.value : '—';
                    const cls = sv && sv.highlight ? ' highlight' : sv && sv.highlightTeal ? ' highlight-teal' : '';
                    html += `<td class="${cls.trim()}">${val}</td>`;
                });
                html += '</tr>';
            });
        });

        html += '<tr class="price-row"><td>起售价</td>' +
                selected.map(p => `<td>${p.price}</td>`).join('') +
                '</tr>';

        document.getElementById('table-body').innerHTML = html;
    }

    function switchCategory(id) {
        currentCategory = id;
        renderCategoryTabs();
        renderProductSelector();
        renderTable();
    }

    function toggleProduct(id) {
        const arr = selectedProducts[currentCategory];
        const i = arr.indexOf(id);
        if (i > -1) arr.splice(i, 1); else arr.push(id);
        if (arr.length === 0) arr.push(id);
        renderProductSelector();
        renderTable();
    }

    loadData();
    </script>
</body>
</html>
